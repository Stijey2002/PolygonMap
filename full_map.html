<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="referrer" content="origin">
        <title>Polygon Map</title>

        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
        <style>
            body { margin: 0; }
            #map { height: 100vh; }
            .marker-icon {
                background: #E8E8E8;
                border: 2px solid #FFFFFF;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;

                transform-origin: center;
                transition: transform 0.15s ease;
            }
            
            .GEN {
                background: #E8E8E8;
                border: 2px solid #000000;
                
                fill-opacity: .1;
                fill: #000000;
                stroke: #000000;
            }
            
            .PEN {
                background: #AAD6C5;
                border: 2px solid #008351;
                
                fill-opacity: .1;
                fill: #008351;
                stroke: #008351;
            }
            
            .FUE {
                background: #B5D7DA;
                border: 2px solid #21888F;
                
                fill-opacity: .1;
                fill: #21888F;
                stroke: #21888F;
            }
            
            .OTK {
                background: #FFD4C5;
                border: 2px solid #FF7F50;
                
                 fill-opacity: .1;
                 fill: #FF7F50;
                 stroke: #FF7F50;
            }
            
            .MAU {
                background: #E6D4C3;
                border: 2px solid #B57D4A;
                
                fill-opacity: .1;
                fill: #B57D4A;
                stroke: #B57D4A;
            }
            
            .marker-text {
                color: black;
                font-weight: bold;
                font-size: 14px;
            }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
        <script>
            let polygonData = [];
            const map = L.map('map').setView([48.2, 16.37], 12);
            const urlParams = new URLSearchParams(window.location.search);
            const show = urlParams.get('show');

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            async function loadPolygons() {
                try {
                    const response = await fetch('polygon_data.json');
                    polygonData = await response.json();
                    drawPolygons();
                } catch (e) {
                    console.error(e);
                }
            }
            
            function drawPolygons() {
                polygonData.forEach(item => {
                    let polygonClass = '';
                    if (0000 == item.int_n) polygonClass = 'GEN';
                    else if (1400 <= item.int_n && item.int_n < 1500) polygonClass = 'PEN';
                    else if (1500 <= item.int_n && item.int_n < 1600) polygonClass = 'FUE';
                    else if (1600 <= item.int_n && item.int_n < 1700) polygonClass = 'OTK';
                    else if (3000 <= item.int_n && item.int_n < 3100) polygonClass = 'MAU';
                    const polygon = L.polygon(item.coords, {
                        className: `${polygonClass}`
                    }).addTo(map);
                    if (item.int_n === 0000) map.fitBounds(polygon.getBounds());
                    let n = item.ext_n;
                    if (show == 'int') n = item.int_n;
                    L.marker(polygon.getBounds().getCenter(), {
                        icon: L.divIcon({
                          className: `marker-icon ${polygonClass}`,
                          html: `<div class="marker-text">${n}</div>`,
                          iconSize: [32, 24]
                        })
                    }).addTo(map);
                });
            }
            
            loadPolygons();
        </script>
    </body>
</html>
